<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0b0d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="signalbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c5c"/>
      <stop offset="33%" stop-color="#ff8a3d"/>
      <stop offset="66%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#4fd1a5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0b0b0d"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#232329"/>

  <!-- mark -->
  <rect x="56" y="56" width="40" height="40" rx="9" fill="#ff8a3d" fill-opacity="0.15"/>
  <circle cx="76" cy="76" r="11" fill="none" stroke="#ff8a3d" stroke-width="2.4"/>
  <circle cx="76" cy="76" r="5.5" fill="none" stroke="#ff8a3d" stroke-width="2.4"/>
  <circle cx="76" cy="76" r="1.8" fill="#ff8a3d"/>

  <text x="112" y="70" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#f5f5f4">support-ai</text>
  <text x="112" y="88" font-family="Inter, sans-serif" font-size="11" fill="#6c6c74">triage &#183; account intelligence</text>

  <text x="56" y="150" font-family="Inter, sans-serif" font-size="40" font-weight="700" fill="#f5f5f4">Support AI for Technical</text>
  <text x="56" y="196" font-family="Inter, sans-serif" font-size="40" font-weight="700" fill="#f5f5f4">Support &amp; TAM teams</text>

  <text x="57" y="228" font-family="Inter, sans-serif" font-size="15" fill="#98989f">Ticket triage &#183; account health briefs &#183; local RAG &#183; eval harness &#183; Groq</text>

  <!-- signal spectrum bar, echoing P1-P4 urgency tiers -->
  <rect x="56" y="252" width="360" height="4" rx="2" fill="url(#signalbar)"/>
  <text x="56" y="278" font-family="JetBrains Mono, monospace" font-size="11" fill="#47474e">P1 critical &#8594; P4 low-impact triage spectrum</text>

  <!-- stat chips -->
  <g font-family="JetBrains Mono, monospace" font-size="13">
    <rect x="820" y="52" width="150" height="44" rx="8" fill="#131317" stroke="#232329"/>
    <text x="836" y="79" fill="#ff8a3d" font-weight="600">500</text>
    <text x="866" y="79" fill="#98989f">tickets</text>

    <rect x="982" y="52" width="150" height="44" rx="8" fill="#131317" stroke="#232329"/>
    <text x="998" y="79" fill="#ff8a3d" font-weight="600">50</text>
    <text x="1022" y="79" fill="#98989f">accounts</text>

    <rect x="820" y="104" width="150" height="44" rx="8" fill="#131317" stroke="#232329"/>
    <text x="836" y="131" fill="#ff8a3d" font-weight="600">9</text>
    <text x="854" y="131" fill="#98989f">KB docs</text>

    <rect x="982" y="104" width="150" height="44" rx="8" fill="#131317" stroke="#232329"/>
    <text x="998" y="131" fill="#4fd1a5" font-weight="600">8/10</text>
    <text x="1042" y="131" fill="#98989f">eval pass</text>
  </g>
</svg>
